# GitHub Actions Workflow - CI/CD for Chess Daily Trainer

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chess-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./chess-app

      - name: Run ESLint
        run: npm run lint
        working-directory: ./chess-app

      - name: Type-check with TypeScript
        run: npx tsc --noEmit
        working-directory: ./chess-app

      - name: Build application
        run: npm run build
        working-directory: ./chess-app

